<!DOCTYPE html>
<html>
<head>
    <title>Katalog Aksesoris - Repa Pitriani</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .identitas { color: #555; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1 id="katalog-judul">Memuat...</h1>
    
    <div class="identitas">
        <p><strong>Pemilik:</strong> <span id="katalog-pemilik">-</span></p>
        <p><strong>NIM:</strong> <span id="katalog-nim">-</span></p>
    </div>

    <h3>Daftar Aksesoris:</h3>
    <ul id="item-list"></ul>
    <hr>
    
    <h3>Tambah Aksesoris Baru:</h3>
    <input type="text" id="item-input" placeholder="Nama aksesoris (misal: Jam Tangan)">
    <button onclick="tambahItem()">Tambah</button>

    <script>
    // RELATIVE PATH - harus /api supaya jalan di AKS
    const API_URL = '/api';

    function loadData() {
        fetch(`${API_URL}/info`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('katalog-judul').innerText = data.judul_katalog;
                document.getElementById('katalog-pemilik').innerText = data.pemilik;
                document.getElementById('katalog-nim').innerText = data.nim;

                const list = document.getElementById('item-list');
                list.innerHTML = "";
                data.items.forEach(item => {
                    if (item.endsWith(':')) {
                        let header = document.createElement('h4');
                        header.innerText = item;
                        header.style.marginTop = '15px';
                        header.style.marginBottom = '5px';
                        list.appendChild(header);
                    } else {
                        let li = document.createElement('li');
                        li.innerText = item;
                        list.appendChild(li);
                    }
                });
            })
            .catch(err => {
                console.error("Gagal ambil data:", err);
                document.getElementById('katalog-judul').innerText = 'Gagal memuat data';
            });
    }

    function tambahItem() {
        const input = document.getElementById('item-input');
        if (input.value.trim() === "") return;

        fetch(`${API_URL}/add-item`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ item: input.value })
        })
        .then(res => res.json())
        .then(() => {
            input.value = "";
            loadData();
        });
    }

    loadData();
    </script>
</body>
</html>
